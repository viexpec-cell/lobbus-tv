<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lobbus TV · Abertura</title>
<style>
@font-face{font-family:'Geist Mono';font-weight:400;src:url(assets/geist-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:500;src:url(assets/geist-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2) format('woff2')}
html,body{margin:0;background:#0D0906;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(async function () {
  'use strict';
  const W = 1920, H = 1080, CX = 960, CY = 540;
  const C = { ink: '#0D0906', text: '#F6EFE9', muted: '#AB9C8F', dim: '#8A7B6F', or: '#F2600C', on: '#140C06', ok: '#5BD68A', line: 'rgba(255,233,219,0.09)', line2: 'rgba(255,233,219,0.17)' };
  const MONO = '"Geist Mono", monospace';
  const cv = document.getElementById('c'); let cx = cv.getContext('2d'); const MAIN = cx;
  const MODE = new URLSearchParams(location.search).get('t') || 'encaixe';
  const G = { gridA: 1, hudA: 1, tagA: 1, wolfA: 1, dustA: 1, hideLockup: false, hideWolf: false };
  const TL = await (await fetch('timeline.json')).json();
  const wolfData = await (await fetch('assets/wolf_pts.json')).json();
  const loadImg = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
  const [IMG_WOLF, IMG_WM, IMG_HOME] = await Promise.all([loadImg('assets/wolf_white.png'), loadImg('assets/wordmark_white.png'), loadImg('assets/home.jpg')]);
  await Promise.all([document.fonts.load('500 20px "Geist Mono"'), document.fonts.load('400 20px "Geist Mono"')]);
  const SVG_TXT = await (await fetch('assets/lobo.svg')).text();
  const WOLF_PATH = new Path2D(SVG_TXT.match(/ d="([^"]+)"/)[1]);

  /* ---------- utilidades ---------- */
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const pr = (t, r) => cl((t - r[0]) / (r[1] - r[0]));
  const sm = x => x * x * (3 - 2 * x);
  const power2InOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const power2In = x => x * x;
  const expoOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const expoInOut = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
  const backOut = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  function txt(s, x, y, size, color, { weight = 500, align = 'left', ls = 0.14, alpha = 1 } = {}) {
    if (alpha <= 0) return 0;
    cx.globalAlpha = cl(alpha); cx.font = `${weight} ${size}px ${MONO}`; cx.fillStyle = color; cx.textAlign = align;
    cx.letterSpacing = (ls * size) + 'px'; cx.fillText(s, x, y); const w = cx.measureText(s).width; cx.letterSpacing = '0px'; cx.globalAlpha = 1; return w;
  }
  const SCR = '01<>/#_LOBUS';
  function scramble(str, t, start, dur) {
    if (t < start) return '';
    const p = (t - start) / dur, n = str.length; let out = '';
    for (let i = 0; i < n; i++) {
      const ch = str[i];
      if (ch === ' ') { out += ' '; continue; }
      const shown = p > (i / n) * 0.55;
      const solved = p > 0.35 + (i / n) * 0.65;
      if (!shown) out += ' '; else if (solved) out += ch; else out += SCR[Math.floor(hash(Math.floor(t * 30), i) * SCR.length)];
    }
    return out;
  }

  /* ---------- partículas (mesma receita do site: ruído de mercado → lobo) ---------- */
  const N = wolfData.pts.length / 2, rnd = mulberry(20261022);
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); };
  const WA = 2.5, CAMZ = 6, PX = H / 2 * (1 / Math.tan(22.5 * Math.PI / 180)) / CAMZ;
  const P = [];
  for (let i = 0; i < N; i++) {
    const r = [rnd(), rnd(), rnd(), rnd()];
    if (i % 13 === 0) { P.push({ dust: 1, x: (rnd() - .5) * 13, y: (rnd() - .5) * 7.5, z: 1.5 - rnd() * 5.5, r }); continue; }
    const X = wolfData.pts[i * 2] * WA, Y = -wolfData.pts[i * 2 + 1] * WA;
    const Z = (rnd() - .5) * .16 + .28 * (1 - Math.min(1, (X * X + Y * Y) / 1.9));
    P.push({ dust: 0, wx: X, wy: Y, wz: Z, nx: gauss() * 2.9, ny: gauss() * 1.55, nz: gauss() * 1.4 - .4, r });
  }
  const TONES = 16, SPR = [];
  const c1 = [.79, .29, .02], c2 = [.95, .38, .05], c3 = [1, .9, .84];
  for (let k = 0; k < TONES; k++) {
    const v = k / (TONES - 1);
    const col = v < .62 ? c1.map((a, j) => a + (c2[j] - a) * (v / .62)) : c2.map((a, j) => a + (c3[j] - a) * ((v - .62) / .38));
    const s = document.createElement('canvas'); s.width = s.height = 32; const g = s.getContext('2d');
    const id = g.createImageData(32, 32);
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
      const d = Math.hypot(x + .5 - 16, y + .5 - 16) / 32; const a = sm(cl((0.5 - d) / (0.5 - 0.04)));
      const o = (y * 32 + x) * 4; id.data[o] = col[0] * 255; id.data[o + 1] = col[1] * 255; id.data[o + 2] = col[2] * 255; id.data[o + 3] = a * 255;
    }
    g.putImageData(id, 0, 0); SPR.push(s);
  }
  function drawParticles(t) {
    const appear = sm(pr(t, TL.noiseIn));
    if (appear <= 0) return;
    const m = sm(pr(t, TL.morph));
    const dis = pr(t, TL.dissolve), disE = expoOut(dis);
    const fadeOut = 1 - sm(dis);
    const ry = 1.1 * Math.pow(1 - m, 2) + 0.05 * Math.sin(t * .35);
    const cy = Math.cos(ry), sy = Math.sin(ry);
    cx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < N; i++) {
      const p = P[i], r = p.r; let x, y, z, a;
      if (p.dust) {
        x = p.x + 0.04 * Math.sin(t * .7 + r[1] * 50); y = p.y + 0.04 * Math.cos(t * .6 + r[2] * 50); z = p.z;
        a = 0.55 * appear * (1 - .5 * dis) * G.dustA;
      } else {
        let lf = cl((m - r[0] * .45) / .55); lf = sm(lf);
        x = p.nx + (p.wx - p.nx) * lf; y = p.ny + (p.wy - p.ny) * lf; z = p.nz + (p.wz - p.nz) * lf;
        const tr = Math.sin(Math.PI * lf);
        x += (r[1] - .5) * tr * 1.7; y += (r[2] - .5) * tr * 1.7; z += (r[3] - .5) * tr * 1.7;
        x += .022 * Math.sin(t * .7 + r[1] * 50); y += .022 * Math.cos(t * .6 + r[2] * 50);
        if (dis > 0) { const k = 1 + disE * (0.10 + r[3] * 0.22); x *= k; y *= k; z += disE * (r[1] - .5) * 1.2; }
        a = appear * fadeOut;
        const xr = cy * x + sy * z, zr = -sy * x + cy * z; x = xr; z = zr;
      }
      if (a <= 0.002) continue;
      const dd = Math.max(CAMZ - z, .05);
      const k = CAMZ / dd;
      const sx = CX + x * PX * k, sy2 = CY - y * PX * k;
      if (sx < -10 || sx > W + 10 || sy2 < -10 || sy2 > H + 10) continue;
      const fog = cl(1.25 - (dd - CAMZ) * .14, .12, 1);
      const tw = .68 + .32 * Math.sin(t * 2.2 + r[3] * 60);
      const size = 3.8 * (.55 + r[0] * .9) * k;
      cx.globalAlpha = cl(a * fog * tw);
      cx.drawImage(SPR[Math.min(TONES - 1, Math.floor(r[1] * TONES))], sx - size / 2, sy2 - size / 2, size, size);
    }
    cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  }

  /* ---------- layout da assinatura ---------- */
  const WOLF_ASP = IMG_WOLF.width / IMG_WOLF.height;
  const bigH = WA * PX, bigW = bigH * WOLF_ASP;
  const LK = (() => {
    const h = 300, s = h / 697, w = h * WOLF_ASP;
    const wmW = IMG_WM.width * s, wmH = IMG_WM.height * s, gap = (696 - 598) * s;
    const pillH = 54, pillW = 108, pillGap = 26;
    const total = w + gap + wmW + pillGap + pillW;
    const x0 = CX - total / 2, top = CY - h / 2 - 14;
    return { h, w, s, x0, top, wmX: x0 + w + gap, wmY: top + 177 * s, wmW, wmH, pillX: x0 + w + gap + wmW + pillGap, pillY: top + 177 * s + wmH * 0.56 - pillH / 2, pillW, pillH, tagY: top + 474 * s + 36 };
  })();

  function drawWolfSolid(t) {
    if (t < TL.scan[0] || G.hideWolf || G.wolfA <= 0) return;
    const sp = pr(t, TL.scan);
    const mv = expoInOut(pr(t, TL.wolfToLockup));
    const bump = 1 + 0.035 * Math.sin(Math.PI * pr(t, [TL.hit, TL.hit + 0.28]));
    const h = (bigH + (LK.h - bigH) * mv) * bump, w = h * WOLF_ASP;
    const cX = CX + ((LK.x0 + LK.w / 2) - CX) * mv, cY = CY + ((LK.top + LK.h / 2) - CY) * mv;
    const x = cX - w / 2, y = cY - h / 2;
    const revealY = y + h * sp;
    cx.save(); cx.beginPath(); cx.rect(0, 0, W, revealY); cx.clip();
    cx.globalAlpha = G.wolfA; cx.drawImage(IMG_WOLF, x, y, w, h); cx.globalAlpha = 1;
    const fl = 1 - sm(pr(t, [TL.hit + 0.04, TL.hit + 0.42]));
    if (fl > 0) { cx.globalAlpha = fl; cx.drawImage(TINT_OR, x, y, w, h); cx.globalAlpha = 1; }
    cx.restore();
    if (sp > 0 && sp < 1) {
      cx.fillStyle = C.or; cx.globalAlpha = 0.95; cx.fillRect(x - 40, revealY - 1.5, w + 80, 3); cx.globalAlpha = 1;
      cx.globalAlpha = 0.18; cx.fillRect(x - 40, revealY - 14, w + 80, 12); cx.globalAlpha = 1;
    }
  }
  const TINT_OR = (() => { const o = document.createElement('canvas'); o.width = IMG_WOLF.width; o.height = IMG_WOLF.height; const g = o.getContext('2d'); g.drawImage(IMG_WOLF, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = C.or; g.fillRect(0, 0, o.width, o.height); return o; })();

  function drawLockupText(t) {
    const wp = pr(t, TL.wordmark);
    if (wp > 0 && !G.hideLockup) {
      const e = expoOut(wp);
      cx.save(); cx.beginPath(); cx.rect(LK.wmX - 4, LK.wmY - 6, LK.wmW + 8, LK.wmH + 12); cx.clip();
      cx.drawImage(IMG_WM, LK.wmX, LK.wmY + (1 - e) * LK.wmH * 1.12, LK.wmW, LK.wmH); cx.restore();
    }
    const pp = pr(t, TL.pill);
    if (pp > 0 && !G.hideLockup) {
      const e = backOut(pp, 1.8), a = cl(pp * 2.5);
      const pw = LK.pillW * (0.35 + 0.65 * e), ph = LK.pillH * (0.6 + 0.4 * e);
      const px = LK.pillX, py = LK.pillY + (LK.pillH - ph) / 2;
      cx.globalAlpha = a; cx.fillStyle = C.or; cx.beginPath(); cx.roundRect(px, py, pw, ph, ph / 2); cx.fill(); cx.globalAlpha = 1;
      if (pp > 0.45) txt('TV', px + pw / 2 + 2, py + ph / 2 + 11, 30, C.on, { weight: 500, align: 'center', ls: 0.08, alpha: cl((pp - .45) / .3) });
    }
    if (t > TL.tagline[0]) txt(scramble('O MARKETING COMO DEVE SER.', t, TL.tagline[0], TL.tagline[1] - TL.tagline[0]), LK.wmX + 4, LK.tagY, 19, C.muted, { weight: 400, ls: 0.3, alpha: G.tagA });
  }

  /* ---------- sistema: grade, HUD, loader e log ---------- */
  function drawGrid(t) {
    const a = sm(pr(t, TL.hudIn)) * 0.55 * G.gridA; if (a <= 0) return;
    cx.globalAlpha = a; cx.fillStyle = 'rgba(255,233,219,0.09)';
    const x0 = 96, w = W - 192;
    for (let i = 0; i <= 6; i++) cx.fillRect(Math.round(x0 + w * i / 6), 0, 1, H);
    cx.globalAlpha = 1;
  }
  function drawHud(t) {
    const a = sm(pr(t, TL.hudIn)) * G.hudA; if (a <= 0) return;
    const m = 72, y1 = 84, y2 = H - 64, sz = 16;
    const core = scramble('LOBBUS.CORE', t, 0.05, 0.9);
    let w = txt(core, m, y1, sz, C.text, { alpha: a });
    txt('  //  TV v0.3', m + w, y1, sz, C.dim, { alpha: a });
    const secs = 8 + Math.floor(t);
    const clock = '23:21:' + String(secs).padStart(2, '0');
    const wc = txt(clock, W - m, y1, sz, C.text, { align: 'right', alpha: a });
    const wd = txt('QUI · 22 OUT  ·  ', W - m - wc, y1, sz, C.dim, { align: 'right', alpha: a });
    txt('31°46′S · 52°20′W', m, y2, sz, C.dim, { alpha: a });
    const wo = txt('ONLINE', W - m, y2, sz, C.ok, { align: 'right', alpha: a });
    const dotX = W - m - wo - 18;
    const ping = (t * 0.45) % 1;
    cx.globalAlpha = a; cx.fillStyle = C.ok; cx.beginPath(); cx.arc(dotX, y2 - 6, 4.5, 0, 7); cx.fill();
    cx.globalAlpha = a * 0.5 * (1 - ping); cx.strokeStyle = C.ok; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(dotX, y2 - 6, 4.5 + ping * 12, 0, 7); cx.stroke(); cx.globalAlpha = 1;
    txt('STATUS  ', dotX - 14, y2, sz, C.dim, { align: 'right', alpha: a });
  }
  const LOG = [['NÚCLEO LOBBUS', 'OK', 'ok'], ['FONTE XTREAM', 'CONECTADA', 'ok'], ['CANAIS', '312', 'text'], ['GUIA DE PROGRAMAÇÃO', 'ATÉ 06:00', 'text'], ['FILMES', '1.840', 'text'], ['SÉRIES', '214', 'text']];
  function drawLoader(t) {
    const out = pr(t, TL.loaderOut); if (out >= 1) return;
    const a = 1 - power2In(out), dy = -24 * power2In(out);
    if (t < TL.counter[0] - 0.15) return;
    const ain = sm(pr(t, [TL.counter[0] - 0.15, TL.counter[0] + 0.1]));
    const v = Math.round(100 * power2InOut(pr(t, TL.counter)));
    const num = String(v).padStart(3, '0');
    const sz = 20, y = CY - 70 + dy;
    cx.font = `500 ${sz}px ${MONO}`; cx.letterSpacing = (0.14 * sz) + 'px';
    const lw = cx.measureText('INICIANDO ').width, nw = cx.measureText(num).width; cx.letterSpacing = '0px';
    const x0 = CX - (lw + nw) / 2;
    txt('INICIANDO ', x0, y, sz, C.muted, { alpha: a * ain });
    txt(num, x0 + lw, y, sz, C.text, { alpha: a * ain });
    const bw = 300, by = y + 30;
    cx.globalAlpha = a * ain; cx.fillStyle = C.line2; cx.fillRect(CX - bw / 2, by, bw, 2);
    cx.fillStyle = C.or; cx.fillRect(CX - bw / 2, by, bw * v / 100, 2); cx.globalAlpha = 1;
    const lx = CX - 300, rx = CX + 300, ly0 = by + 70, lh = 34, lsz = 16;
    LOG.forEach((l, i) => {
      const st = TL.logLines[i]; if (t < st) return;
      const la = a * sm(cl((t - st) / 0.08));
      const yy = ly0 + i * lh + dy * 0;
      const lt = '> ' + l[0];
      const w1 = txt(lt, lx, yy, lsz, C.dim, { weight: 400, alpha: la });
      const val = t < st + 0.16 ? scramble(l[1], t, st, 0.16) : l[1];
      cx.font = `500 ${lsz}px ${MONO}`; cx.letterSpacing = (0.14 * lsz) + 'px'; const w2 = cx.measureText(l[1]).width; const dw = cx.measureText('.').width; cx.letterSpacing = '0px';
      const n = Math.max(2, Math.floor((rx - lx - w1 - w2 - 24) / dw));
      txt('.'.repeat(n), lx + w1 + 10, yy, lsz, 'rgba(255,233,219,0.22)', { weight: 400, alpha: la });
      txt(val, rx, yy, lsz, C[l[2]], { align: 'right', alpha: la });
    });
  }

  /* ---------- quadro completo ---------- */
  const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const OFFCX = OFF.getContext('2d');
  function introLayer(t, target) {
    const prev = cx; cx = target || MAIN;
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = C.ink; cx.fillRect(0, 0, W, H);
    drawGrid(t); drawParticles(t); drawLoader(t); drawWolfSolid(t); drawLockupText(t); drawHud(t);
    cx = prev;
  }
  const lerp = (a, b, e) => a + (b - a) * e;
  const easeInCubic = x => x * x * x;
  const TR = TL.trans;                     /* [início, fim] da transição */
  const HOME_BG = '#0D0906';
  /* faixas da tela Início (medidas no print aprovado, 1920x1080) */
  const HDR = { wm: { x: 202, y: 96, w: 131, h: 24 }, pill: { x: 350, y: 98, w: 42, h: 21 }, date: [410, 88, 230, 40] };
  const ROWS = [[166, 200, 'mask'], [208, 320, 'mask'], [326, 452, 'mask'], [458, 502, 'rise'], [510, 582, 'rise'], [598, 708, 'rise'], [738, 778, 'rise'], [802, 1030, 'rise']];
  function homeSlice(sx, sy, sw, sh, dx, dy, a = 1) { if (a <= 0) return; cx.globalAlpha = cl(a); cx.drawImage(IMG_HOME, sx, sy, sw, sh, dx, dy, sw, sh); cx.globalAlpha = 1; }

  /* 1 · Encaixe: a assinatura voa para o cabeçalho e o Início se monta em volta */
  function tEncaixe(t) {
    const p0 = TR[0];
    G.gridA = 1 - sm(pr(t, [p0, p0 + 0.3])); G.hudA = G.gridA; G.tagA = 1 - sm(pr(t, [p0, p0 + 0.15]));
    G.wolfA = 1 - sm(pr(t, [p0, p0 + 0.18])); G.dustA = G.gridA; G.hideLockup = t >= p0;
    introLayer(t);
    if (t < p0) return;
    /* lobo vira brasas */
    const ep = pr(t, [p0, p0 + 0.55]);
    if (ep > 0 && ep < 1) {
      const k = LK.h / bigH, ccx = LK.x0 + LK.w / 2, ccy = LK.top + LK.h / 2;
      cx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < N; i += 2) {
        const q = P[i]; if (q.dust) continue; const r = q.r;
        const lp = cl((ep - r[0] * 0.25) / 0.75); if (lp <= 0 || lp >= 1) continue;
        const e = expoOut(lp);
        const bx = q.wx * PX * k, by = -q.wy * PX * k, len = Math.hypot(bx, by) + 1;
        const sx = ccx + bx + (bx / len) * e * (40 + r[3] * 110) + (r[1] - .5) * e * 40;
        const sy = ccy + by + (by / len) * e * (40 + r[3] * 110) - e * (30 + r[2] * 70);
        const a = Math.min(1, lp * 12) * Math.pow(1 - lp, 2.2);
        const size = 3.2 * (.55 + r[0] * .9);
        cx.globalAlpha = cl(a); cx.drawImage(SPR[Math.min(TONES - 1, Math.floor(r[1] * TONES))], sx - size / 2, sy - size / 2, size, size);
      }
      cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
    }
    /* menu entra pela esquerda */
    const me = expoOut(pr(t, [p0 + 0.22, p0 + 0.95]));
    if (me > 0) homeSlice(0, 0, 128, H, -128 * (1 - me), 0, Math.min(1, me * 1.6));
    /* linhas do destaque sobem da máscara (mesma entrada da hero do site) */
    ROWS.forEach(([y0, y1, kind], i) => {
      const st = p0 + 0.45 + i * 0.06, e = expoOut(pr(t, [st, st + 1.0]));
      if (e <= 0) return;
      const hgt = y1 - y0;
      if (kind === 'mask') { cx.save(); cx.beginPath(); cx.rect(140, y0, W - 140, hgt); cx.clip(); homeSlice(140, y0, W - 140, hgt, 140, y0 + (1 - e) * hgt * 1.12); cx.restore(); }
      else homeSlice(140, y0, W - 140, hgt, 140, y0 + (1 - e) * 34, Math.min(1, e * 1.4));
    });
    /* data do cabeçalho */
    const de = sm(pr(t, [TR[1] - 0.12, TR[1] + 0.25]));
    homeSlice(HDR.date[0], HDR.date[1], HDR.date[2], HDR.date[3], HDR.date[0] - (1 - de) * 12, HDR.date[1], de);
    /* assinatura voando para o cabeçalho */
    const fe = expoInOut(pr(t, [p0 + 0.05, TR[1] - 0.1]));
    const land = sm(pr(t, [TR[1] - 0.12, TR[1]]));
    const tw = 124, th = 24.5, tcx = HDR.wm.x + HDR.wm.w / 2, tcy = HDR.wm.y + HDR.wm.h / 2;
    const ww = lerp(LK.wmW, tw, fe), wh = lerp(LK.wmH, th, fe);
    const wcx = lerp(LK.wmX + LK.wmW / 2, tcx, fe), wcy = lerp(LK.wmY + LK.wmH / 2, tcy, fe);
    const pw = lerp(LK.pillW, HDR.pill.w, fe), ph = lerp(LK.pillH, HDR.pill.h, fe);
    const pcx = lerp(LK.pillX + LK.pillW / 2, HDR.pill.x + HDR.pill.w / 2, fe), pcy = lerp(LK.pillY + LK.pillH / 2, HDR.pill.y + HDR.pill.h / 2, fe);
    if (land < 1) {
      cx.globalAlpha = 1 - land;
      cx.drawImage(IMG_WM, wcx - ww / 2, wcy - wh / 2, ww, wh);
      cx.fillStyle = C.or; cx.beginPath(); cx.roundRect(pcx - pw / 2, pcy - ph / 2, pw, ph, ph / 2); cx.fill();
      cx.globalAlpha = 1;
      const fs = lerp(30, 11.5, fe);
      txt('TV', pcx + 2 * (1 - fe) + 0.5, pcy + fs * 0.37, fs, C.on, { weight: 500, align: 'center', ls: 0.08, alpha: 1 - land });
    }
    if (land > 0) homeSlice(190, 88, 210, 40, 190, 88, land);
  }

  /* 2 · Mergulho: a câmera atravessa o lobo e o Início surge do escuro */
  const FOC = { x: LK.x0 + 279 / 598 * LK.w, y: LK.top + 395 / 697 * LK.h };
  function tMergulho(t) {
    const p0 = TR[0];
    if (t < p0) { introLayer(t); return; }
    const zp = pr(t, [p0, p0 + 0.55]);
    const sc = Math.exp(Math.log(90) * easeInCubic(zp));
    const fx = lerp(FOC.x, CX, sm(zp)), fy = lerp(FOC.y, CY, sm(zp));
    G.gridA = 1 - sm(pr(t, [p0, p0 + 0.25])); G.hudA = G.gridA; G.dustA = G.gridA; G.hideLockup = true; G.hideWolf = true; G.tagA = 0;
    introLayer(t);
    cx.save();
    cx.globalAlpha = 1 - sm(pr(t, [p0 + 0.42, p0 + 0.56]));
    cx.setTransform(sc, 0, 0, sc, fx - FOC.x * sc, fy - FOC.y * sc);
    cx.save(); cx.translate(LK.x0, LK.top); cx.scale(LK.w / 598, LK.h / 697); cx.fillStyle = '#FFFFFF'; cx.fill(WOLF_PATH); cx.restore();
    cx.drawImage(IMG_WM, LK.wmX, LK.wmY, LK.wmW, LK.wmH);
    cx.fillStyle = C.or; cx.beginPath(); cx.roundRect(LK.pillX, LK.pillY, LK.pillW, LK.pillH, LK.pillH / 2); cx.fill();
    cx.restore();
    if (sc < 6) txt('TV', (LK.pillX + LK.pillW / 2 + 2 - FOC.x) * sc + fx, (LK.pillY + LK.pillH / 2 + 11 - FOC.y) * sc + fy, 30 * sc, C.on, { weight: 500, align: 'center', ls: 0.08, alpha: 1 - zp * 2 });
    const ha = sm(pr(t, [p0 + 0.5, p0 + 0.78]));
    if (ha > 0) {
      const hs = lerp(1.14, 1, expoOut(pr(t, [p0 + 0.5, p0 + 1.3])));
      cx.save(); cx.globalAlpha = ha; cx.translate(CX, CY); cx.scale(hs, hs); cx.drawImage(IMG_HOME, -CX, -CY, W, H); cx.restore(); cx.globalAlpha = 1;
    }
  }

  /* 3 · Persianas: as 6 colunas da grade do site recolhem do centro para fora */
  const COLS = [0, 384, 672, 960, 1248, 1536, 1920];
  const ORDER = [2, 1, 0, 0, 1, 2];
  function tPersianas(t) {
    const p0 = TR[0];
    if (t < p0) { introLayer(t); return; }
    introLayer(t, OFFCX);
    cx.fillStyle = HOME_BG; cx.fillRect(0, 0, W, H);
    for (let c = 0; c < 6; c++) {
      const st = p0 + ORDER[c] * 0.07, e = expoInOut(pr(t, [st, st + 0.5]));
      const x0 = COLS[c], w = COLS[c + 1] - x0, edge = H * (1 - e);
      const rise = (1 - expoOut(pr(t, [st + 0.1, st + 0.9]))) * 28;
      cx.save(); cx.beginPath(); cx.rect(x0, 0, w, H); cx.clip(); cx.drawImage(IMG_HOME, 0, rise, W, H); cx.restore();
      if (edge > 0) cx.drawImage(OFF, x0, 0, w, edge, x0, 0, w, edge);
      if (e > 0 && e < 1) { cx.fillStyle = C.or; cx.fillRect(x0, edge - 1, w, 2); }
    }
  }

  /* 4 · Ligar a TV: a abertura se fecha numa linha de luz e o Início acende dela */
  function tLigar(t) {
    const p0 = TR[0];
    if (t < p0) { introLayer(t); return; }
    const off = pr(t, [p0, p0 + 0.2]), flash = pr(t, [p0 + 0.2, p0 + 0.27]), on = pr(t, [p0 + 0.27, p0 + 0.62]);
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    if (off < 1) {
      introLayer(t, OFFCX);
      const sy = lerp(1, 0.004, off * off), sx = lerp(1, 1.03, off);
      cx.save(); cx.translate(CX, CY); cx.scale(sx, sy); cx.drawImage(OFF, -CX, -CY); cx.globalAlpha = Math.pow(off, 2.5) * 0.9; cx.fillStyle = '#FFF4EC'; cx.fillRect(-CX, -CY, W, H); cx.restore(); cx.globalAlpha = 1;
    } else if (on <= 0) {
      const lw = lerp(1.03, 0.55, flash) * W;
      cx.fillStyle = C.or; cx.globalAlpha = 0.45; cx.fillRect(CX - lw / 2, CY - 7, lw, 14); cx.globalAlpha = 1;
      cx.fillStyle = '#FFF4EC'; cx.fillRect(CX - lw / 2, CY - 2, lw, 4);
    }
    if (on > 0) {
      const e = expoOut(on), sy = lerp(0.004, 1, e), sx = lerp(0.55, 1, expoOut(cl(on * 1.6)));
      cx.save(); cx.translate(CX, CY); cx.scale(sx, sy); cx.drawImage(IMG_HOME, -CX, -CY, W, H);
      cx.globalAlpha = (1 - e) * 0.85; cx.fillStyle = '#FFF4EC'; cx.fillRect(-CX, -CY, W, H); cx.restore(); cx.globalAlpha = 1;
    }
  }

  /* 0 · Cortina (versão 1, reprovada) */
  function tCortina(t) {
    const wp = pr(t, TL.wipe), we = expoInOut(wp);
    if (wp > 0) { const ho = (1 - expoOut(pr(t, [TL.wipe[0] + 0.1, TL.videoEnd]))) * 36; cx.fillStyle = C.ink; cx.fillRect(0, 0, W, H); cx.drawImage(IMG_HOME, 0, ho, W, H); }
    const edge = H * (1 - we);
    if (wp > 0) { introLayer(t, OFFCX); cx.drawImage(OFF, 0, 0, W, edge, 0, 0, W, edge); cx.fillStyle = C.or; if (wp < 1) cx.fillRect(0, edge - 1, W, 2); }
    else introLayer(t);
  }

  const MODES = { encaixe: tEncaixe, mergulho: tMergulho, persianas: tPersianas, ligar: tLigar, cortina: tCortina };
  function renderAt(t) {
    Object.assign(G, { gridA: 1, hudA: 1, tagA: 1, wolfA: 1, dustA: 1, hideLockup: false, hideWolf: false });
    cx = MAIN; cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
    MODES[MODE](t);
  }
  window.renderAt = renderAt;
  window.TL = TL;
  renderAt(0);
  window.READY = true;
})();
</script>
</body>
</html>
